<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070c18"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7894ad"/>
      <stop offset="100%" stop-color="#65796b"/>
    </linearGradient>
    <filter id="pGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="500" height="500" rx="36" fill="url(#avatarBg)"/>
  
  <!-- Subtle border -->
  <rect x="2" y="2" width="496" height="496" rx="34" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Glowing circle halo -->
  <circle cx="250" cy="220" r="140" fill="#7894ad" opacity="0.1" filter="url(#pGlow)"/>
  <circle cx="250" cy="220" r="120" fill="none" stroke="#7894ad" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.4"/>
  <circle cx="250" cy="220" r="100" fill="#13213b" stroke="#7894ad" stroke-width="2"/>

  <!-- Initials / Tech Mark inside -->
  <text x="250" y="248" text-anchor="middle" fill="url(#blueGlow)" font-family="'Manrope', sans-serif" font-weight="900" font-size="88" letter-spacing="-3">EK</text>

  <!-- Floating Tech Badges -->
  <!-- Top Left: Flutter -->
  <g transform="translate(60, 90)">
    <rect width="90" height="34" rx="17" fill="#1e293b" stroke="#7894ad" stroke-opacity="0.4"/>
    <circle cx="18" cy="17" r="5" fill="#7894ad"/>
    <text x="32" y="22" fill="#f8fafc" font-family="'DM Mono', monospace" font-size="11" font-weight="600">Flutter</text>
  </g>

  <!-- Top Right: Python -->
  <g transform="translate(350, 90)">
    <rect width="90" height="34" rx="17" fill="#1e293b" stroke="#7894ad" stroke-opacity="0.4"/>
    <circle cx="18" cy="17" r="5" fill="#d5c184"/>
    <text x="32" y="22" fill="#f8fafc" font-family="'DM Mono', monospace" font-size="11" font-weight="600">Python</text>
  </g>

  <!-- Bottom Left: IA / Data -->
  <g transform="translate(50, 330)">
    <rect width="105" height="34" rx="17" fill="#1e293b" stroke="#7894ad" stroke-opacity="0.4"/>
    <circle cx="18" cy="17" r="5" fill="#7894ad"/>
    <text x="32" y="22" fill="#f8fafc" font-family="'DM Mono', monospace" font-size="11" font-weight="600">IA &amp; Data</text>
  </g>

  <!-- Bottom Right: ESATIC -->
  <g transform="translate(340, 330)">
    <rect width="110" height="34" rx="17" fill="#1e293b" stroke="#8a9aab" stroke-opacity="0.4"/>
    <circle cx="18" cy="17" r="5" fill="#aabaca"/>
    <text x="32" y="22" fill="#f8fafc" font-family="'DM Mono', monospace" font-size="11" font-weight="600">ESATIC L3</text>
  </g>

  <!-- Bottom Identity Bar -->
  <g transform="translate(50, 400)">
    <rect width="400" height="66" rx="16" fill="#0f172a" stroke="#334155"/>
    <circle cx="34" cy="33" r="8" fill="#7894ad"/>
    <circle cx="34" cy="33" r="14" fill="#7894ad" opacity="0.25"/>
    <text x="60" y="28" fill="#f8fafc" font-family="'Manrope', sans-serif" font-weight="700" font-size="13">Kobri Emmanuel Kablan</text>
    <text x="60" y="48" fill="#94a3b8" font-family="'DM Mono', monospace" font-size="10">Stage fin d'études dès Mars 2027</text>
    <text x="375" y="38" text-anchor="end" fill="#7894ad" font-family="'DM Mono', monospace" font-size="11" font-weight="700">Abidjan ↗</text>
  </g>
</svg>
